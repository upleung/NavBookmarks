version: '3'

services:
  navbookmarks:
    image: upleung/navbookmarks:latest
    container_name: navbookmarks
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=123456
    volumes:
      - ./database:/app/database
    restart: unless-stopped